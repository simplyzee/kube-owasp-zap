# Default values for kube-owasp-zap.

image:
  # Official ZAP stable image (also available as ghcr.io/zaproxy/zaproxy:stable).
  repository: zaproxy/zap-stable
  # Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

scan:
  # Only scan sites you own or have written permission to test.
  # Required. For api scans this is the OpenAPI/SOAP definition URL or GraphQL endpoint.
  target: ""

  # baseline: passive, safe for production (spiders, then reports issues it can see)
  # full:     active attacks (SQL injection, XSS...). Use on test environments only
  # api:      scans an API from its OpenAPI, SOAP or GraphQL definition
  type: baseline

  # api scans only: openapi, soap or graphql
  apiFormat: openapi

  # Minutes to spider the target (baseline and full).
  spiderMinutes: 1
  # Also run the Ajax spider for JavaScript-heavy apps (baseline and full).
  ajaxSpider: false
  # Include alpha-quality scan rules.
  includeAlpha: false
  # Fail the Job on WARN alerts as well as FAIL alerts.
  failOnWarnings: false
  # Upper limit, in minutes, for ZAP to start and finish passive scanning (0 = ZAP default).
  maxMinutes: 0
  # Print ZAP debug output.
  debug: false

  # Optional rule config: tab-separated "<rule id>\t<IGNORE|INFO|WARN|FAIL>\t<name>" lines.
  # Generate a starting point with: docker run zaproxy/zap-stable zap-baseline.py -t <url> -g gen.conf
  rulesConfig: ""
    # 10021	FAIL	(X-Content-Type-Options Header Missing)
    # 10038	WARN	(Content Security Policy Header Not Set)

  # Extra ZAP options passed with -z, e.g. "-config connection.timeoutInSecs=120".
  zapOptions: ""
  # Any other arguments for the scan script.
  extraArgs: []

report:
  # Reports written for each scan. Any of: html, json, md, xml
  formats:
    - html
    - json
    - md
  # Print the Markdown report to the pod log when the scan finishes.
  printToLog: true
  # Keep reports in a PersistentVolumeClaim. Otherwise they live only as long as the pod.
  persistence:
    enabled: false
    existingClaim: ""
    size: 1Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

# Cron schedule for recurring scans, e.g. "0 2 * * 1" (02:00 every Monday).
# Empty runs a single scan as a Job; run it again with `helm upgrade`.
schedule: ""

cronJob:
  timeZone: ""
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: false

job:
  # A scan that finds FAIL alerts exits non-zero; don't retry it.
  backoffLimit: 0
  # Stop a scan that runs longer than this.
  activeDeadlineSeconds: 3600
  # Delete finished Jobs (and their logs) after this many seconds. 604800 = 7 days.
  ttlSecondsAfterFinished: 604800

# The scanner doesn't talk to the Kubernetes API.
automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# ZAP runs on the JVM and needs some headroom.
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 2Gi

podAnnotations: {}
podLabels: {}

nodeSelector:
  kubernetes.io/os: linux
tolerations: []
affinity: {}
