{{- include "kube-owasp.validate" . -}}
{{- if not .Values.schedule }}
apiVersion: batch/v1
kind: Job
metadata:
  # The revision suffix gives every `helm upgrade` a fresh Job, so a scan
  # can be re-run without changing the release name.
  name: {{ include "kube-owasp.fullname" . }}-{{ .Release.Revision }}
  labels:
    {{- include "kube-owasp.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  {{- with .Values.job.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  {{- $ttl := index .Values.job "ttlSecondsAfterFinished" }}
  {{- if not (kindIs "invalid" $ttl) }}
  ttlSecondsAfterFinished: {{ int $ttl }}
  {{- end }}
  template:
    {{- include "kube-owasp.podTemplate" . | nindent 4 }}
{{- end }}
